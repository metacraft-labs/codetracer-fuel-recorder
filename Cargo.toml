[package]
name = "codetracer-fuel-recorder"
version = "0.1.0"
edition = "2024"
authors = ["Metacraft Labs Ltd"]
description = "CodeTracer recorder for Sway smart contracts (FuelVM)"
license = "Apache-2.0"

[dependencies]
# CodeTracer trace format
codetracer_trace_types = { path = "../codetracer-trace-format/codetracer_trace_types" }
codetracer_trace_writer_nim = { path = "../codetracer-trace-format/codetracer_trace_writer_nim" }

# FuelVM (must match forc 0.70.x compiler output)
fuel-vm = { version = "0.62", features = ["test-helpers"] }
fuel-tx = { version = "0.62", features = ["test-helpers"] }
fuel-asm = "0.62"
fuel-types = "0.62"

# HTTP client (for GraphQL replay)
reqwest = { version = "0.12", features = ["blocking", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
eyre = "0.6"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
gimli = "0.33"
object = { version = "0.36", features = ["read"] }
