[package]
name = "codetracer-fuel-recorder"
version = "0.1.0"
edition = "2024"
authors = ["Metacraft Labs Ltd"]
description = "CodeTracer recorder for Sway smart contracts (FuelVM)"
license = "Apache-2.0"

# Stylistic clippy 1.93 lints that the test-fixture helpers (synthetic
# source maps, vector-of-tuple builders) and doc comments routinely trip.
# Same workspace-allow pattern as codetracer-move-recorder /
# codetracer-solana-recorder.  Source-level fixes for the doc-comment
# `collapsible_if` / `is_multiple_of` cases are already in place; this
# block covers the test-only `vec_init_then_push`, `&PathBuf`, and
# `type_complexity` warnings that don't meaningfully apply to test
# fixtures.
[lints.clippy]
vec_init_then_push = "allow"
type_complexity = "allow"
ptr_arg = "allow"
doc_overindented_list_items = "allow"
doc_list_item_without_indentation = "allow"

[dependencies]
# CodeTracer trace format
codetracer_trace_types = { path = "../codetracer-trace-format/codetracer_trace_types" }
codetracer_trace_writer_nim = { path = "../codetracer-trace-format/codetracer_trace_writer_nim" }

# FuelVM (must match forc 0.70.x compiler output)
fuel-vm = { version = "0.62", features = ["test-helpers"] }
fuel-tx = { version = "0.62", features = ["test-helpers"] }
fuel-asm = "0.62"
fuel-types = "0.62"

# HTTP client (for GraphQL replay)
reqwest = { version = "0.12", features = ["blocking", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
eyre = "0.6"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
gimli = "0.33"
object = { version = "0.36", features = ["read"] }
